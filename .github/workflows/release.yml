name: Release
# Thin caller — the logic lives in s-b-repo/ci-automation (_reuse-release.yml),
# so improvements there apply here automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_as:
        description: "Force bump level (auto = derive from commits)"
        type: choice
        options: [auto, patch, minor, major, none]
        default: "auto"
      explicit_version:
        description: "Force an exact version e.g. v1.4.0 (overrides release_as)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    uses: s-b-repo/ci-automation/.github/workflows/_reuse-release.yml@main
    with:
      release_as: ${{ inputs.release_as || 'auto' }}
      explicit_version: ${{ inputs.explicit_version || '' }}
    secrets: inherit
